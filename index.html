 commit:function(e){var l=lineById(e.dataset.id);l.commit=!l.commit;if(!l.commit)l.tier=null;mark("meet");render();},
 tier:function(e){var l=lineById(e.dataset.id);l.tier=e.dataset.v;render();},
 due:function(e){var l=lineById(e.dataset.id);if(st.meeting.locked&&l.commit){A.nmt({dataset:{id:l.itemId}});return;}
  if(!canChair()){toast("Only the chair or PM sets the due date before lock.");return;}openPicker(e,{mode:"line",id:l.id,owner:l.owner,value:l.due});},
 pickDay:function(e){pickDay(e.dataset.v);},
 pkMonth:function(e){var d=D(pk.month);d.setUTCMonth(d.getUTCMonth()+(+e.dataset.v));pk.month=S(d);renderPicker();},
 lock:function(){lock();},wrap:function(){st.meeting.wrapOpen=true;render();},wrapClose:function(){st.meeting.wrapOpen=false;render();},
 openItem:function(e){var it=find(e.dataset.id);st.cal.sel=it.id;if(st.cal.view==="month")st.cal.month=monthStart(it.due);st.cal.phoneDay=it.due;
  if(st.tab!=="calendar")go("calendar");else render();var p=document.getElementById("panel");if(p&&window.innerWidth>760&&p.scrollIntoView)p.scrollIntoView({block:"nearest"});},
 closePanel:function(){st.cal.sel=null;render();},
 phoneDay:function(e,ev){if(ev.target.closest(".cc"))return;if(window.innerWidth<=760){st.cal.phoneDay=e.dataset.v;render();}},
 calNav:function(e){var c=st.cal,n=+e.dataset.v;if(c.view==="month"){var d=D(c.month);d.setUTCMonth(d.getUTCMonth()+n);c.month=S(d);}else c.weekStart=add(weekStart(),7*n);render();},
 calToday:function(){st.cal.month=monthStart(TODAY);st.cal.weekStart=null;render();},
 calView:function(e){st.cal.view=e.dataset.v;render();},
 fMine:function(){st.cal.mine=!st.cal.mine;render();},
 checkOff:function(e){var it=find(e.dataset.id);if(rolePerson()!==it.owner){toast("Only "+PBY[it.owner].name+" can check this off.");return;}
  it.state="done_pending";it.ownerDoneAt=TODAY;logIt(it,"Checked off by owner"+(TODAY>it.due?" (after due)":""));mark("check");render();toast("Checked off. It now shows blue “… Confirm” for the chair.");},
 acceptItem:function(e){var it=find(e.dataset.id);if(st.accept!=="OPTIONAL")return;it.accepted=true;logIt(it,"Owner accepted (optional acknowledgement)");render();toast("Accepted. This never changes counting.");},
 concern:function(e){reasonModal("Raise a concern","saveConcern",e.dataset.id,"What worries you about this commitment?");},
 saveConcern:function(e){var t=document.getElementById("reasonTxt").value.trim();if(!t){toast("Write the concern first.");return;}var it=find(e.dataset.id);it.concerns.push({text:t,by:ROLES[st.role].label,at:fmtS(TODAY)});logIt(it,"Concern raised: “"+t+"”");closeAll();render();toast("Concern logged for the chair and PM (demo only).");},
 nmt:function(e){var it=find(e.dataset.id);if(!it)return;if(it.state!=="open"||pastDue(it)){toast("Need more time is only for open items before their due date.");return;}if(it.request){toast("A date change is already pending.");return;}reqModal(it,null);},
 sendReq:function(e){var it=find(e.dataset.id),s=md&&md.state,r=document.getElementById("reqReason").value.trim();
  if(!s||!s.date){toast("Pick the new date.");return;}if(s.date===it.due){toast("Pick a different date.");return;}if(!r){toast("A reason is required.");return;}
  it.request={date:s.date,reason:r,by:ROLES[st.role].label};logIt(it,"Requested new date "+fmt(s.date)+": “"+r+"”");st.cal.sel=it.id;mark("move");closeAll();render();toast("Request sent. The chip stays put until the chair or PM approves.");},
 approveReq:function(e){var it=find(e.dataset.id),r=it.request,old=it.due;it.due=r.date;it.request=null;logIt(it,"Renegotiated "+fmtS(old)+" → "+fmtS(r.date)+" (approved before due · no deduction)");if(st.cal.view==="month")st.cal.month=monthStart(it.due);mark("move");render();toast("Approved. The chip moved to "+fmt(r.date)+".");},
 declineReq:function(e){var it=find(e.dataset.id);logIt(it,"Date change declined (stays "+fmtS(it.due)+")");it.request=null;render();toast("Declined. Due date unchanged.");},
 confirm:function(e){var it=find(e.dataset.id),v=e.dataset.v,before=stats(it.owner).pct,tb=team().pct;it.state=v;logIt(it,"Confirmed "+ST[v][1]);mark("confirm");render();
  toast(PBY[it.owner].name+": on-time "+before.toFixed(1)+"% → "+stats(it.owner).pct.toFixed(1)+"% · team "+tb.toFixed(1)+"% → "+team().pct.toFixed(1)+"%");},
 excuse:function(e){reasonModal("Excuse (PM)","saveExcuse",e.dataset.id,"Why was this out of the owner’s control?");},
 saveExcuse:function(e){var t=document.getElementById("reasonTxt").value.trim();if(!t){toast("A reason is required.");return;}var it=find(e.dataset.id);it.state="excused";it.request=null;logIt(it,"Excused by PM: “"+t+"”");closeAll();render();toast("Excused: not counted, no deduction.");},
 bpReset:function(){["S","M","L"].forEach(function(t,i){document.getElementById("bp"+t).value=[1,2,4][i];});},
 bpSave:function(){var v={S:+document.getElementById("bpS").value,M:+document.getElementById("bpM").value,L:+document.getElementById("bpL").value},note=document.getElementById("bpNote").value.trim(),err=document.getElementById("bpErr");
  if(!(v.S>=0.5&&v.M>=0.5&&v.L>=0.5&&v.S<=20&&v.M<=20&&v.L<=20)){err.textContent="Each rate must be between 0.5% and 20%.";return;}
  if(!(v.S<v.M&&v.M<v.L)){err.textContent="Keep S < M < L.";return;}if(!note){err.textContent="A change note is required (it goes in the audit log).";return;}
  var o=st.bp;st.bp=v;st.settingsLog.push({at:fmtS(TODAY),by:"PM",t:"Tier weights "+o.S+"/"+o.M+"/"+o.L+"% → "+v.S+"/"+v.M+"/"+v.L+"% · note “"+note+"”"});mark("pct");render();toast("Saved and logged. Commitments locked from now on use "+v.S+"/"+v.M+"/"+v.L+"%.");}
};
document.addEventListener("click",function(ev){var el=ev.target.closest("[data-act]");if(!el)return;var a=el.dataset.act;
 if(el.tagName==="SELECT"||el.tagName==="INPUT")return;if(el.disabled)return;if(a==="closeOverlay"&&el.id==="ov"&&ev.target!==el)return;if(A[a])A[a](el,ev);});
document.addEventListener("change",function(ev){var el=ev.target,a=el.dataset&&el.dataset.act;
 if(a==="fPerson"){st.cal.person=el.value;render();}else if(a==="fStatus"){st.cal.status=el.value;render();}
 else if(a==="tryChk"){st.tried[el.dataset.v]=el.checked;renderChrome();save();}
 else if(a==="remember"){st.remember=el.checked;save();toast(st.remember?"Saved on this device only.":"Not saved: closing the file resets the demo.");}});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeAll();
 if(ev.key==="Enter"&&ev.target.id==="lineInput"){ev.preventDefault();A.addLine();}
 if(ev.key==="Enter"&&ev.target.id==="pickType"){ev.preventDefault();var d=parseDate(ev.target.value);if(!d){toast("Couldn’t read that date. Try thu, oct 30, +3d, next mtg.");return;}if(d<TODAY){toast("That date is in the past.");return;}pickDay(d);}});
document.addEventListener("mouseover",function(ev){if(!pk||!ev.target.closest)return;var b=ev.target.closest(".mini button");if(!b||b.disabled||pk.hover===b.dataset.v)return;
 var prev=pk.hover;pk.hover=b.dataset.v;var ex=pk.mode==="line"?pk.id:pk.itemId;if(ownerLoad(pk.owner,pk.hover,ex)>=2||(prev&&ownerLoad(pk.owner,prev,ex)>=2))renderPicker();});
var lpT=null;
document.addEventListener("touchstart",function(ev){var b=ev.target.closest&&ev.target.closest(".tier button");if(!b)return;lpT=setTimeout(function(){toast(b.getAttribute("title"));},450);},{passive:true});
document.addEventListener("touchend",function(){clearTimeout(lpT);},{passive:true});
var dragId=null;
document.addEventListener("dragstart",function(ev){var c=ev.target.closest&&ev.target.closest('.cc[draggable="true"]');if(!c)return;dragId=c.dataset.id;try{ev.dataTransfer.setData("text/plain",dragId);ev.dataTransfer.effectAllowed="move";}catch(x){}});
document.addEventListener("dragover",function(ev){if(!dragId||!ev.target.closest)return;var d=ev.target.closest("[data-day]");if(!d)return;ev.preventDefault();var o=document.querySelectorAll(".day.drop");for(var i=0;i<o.length;i++)o[i].classList.remove("drop");d.classList.add("drop");});
document.addEventListener("drop",function(ev){if(!dragId||!ev.target.closest)return;var d=ev.target.closest("[data-day]");if(!d)return;ev.preventDefault();var it=find(dragId),day=d.dataset.day;dragId=null;
 if(day<TODAY){toast("Can’t move to a past day.");render();return;}if(day===it.due){render();return;}st.cal.sel=it.id;render();reqModal(it,day);});
document.addEventListener("dragend",function(){dragId=null;var o=document.querySelectorAll(".day.drop");for(var i=0;i<o.length;i++)o[i].classList.remove("drop");});
window.__proto={state:function(){return st;}};
render();
})();
</script>
</body></html>
